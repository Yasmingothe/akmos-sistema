# ===================== SERVIDOR =====================
# Serviços de hospedagem (ex.: Render) informam a porta pela variável PORT
quarkus.http.port=${PORT:8080}
# Fotos enviadas pelo painel: até 3 MB cada (o limite do envio fica um pouco acima)
quarkus.http.limits.max-body-size=5M

# Cadastra os produtos e kits da revista quando o banco está vazio
akmos.dados-iniciais=true

# ===================== BANCO DE DADOS (PostgreSQL) =====================
# Em produção, defina as variáveis de ambiente DB_URL, DB_USUARIO e DB_SENHA.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/akmos}
quarkus.datasource.username=${DB_USUARIO:postgres}
quarkus.datasource.password=${DB_SENHA:postgres}

# Cria/atualiza a tabela automaticamente sem apagar os cliques já gravados
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ===================== LOGIN DO PAINEL DO REVENDEDOR =====================
# Usuário "admin" com papel "admin". TROCAR a senha (ou defina ADMIN_SENHA no servidor).
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=${ADMIN_SENHA:akmos2026}
quarkus.security.users.embedded.roles.admin=admin

# ===================== CORS =====================
# Endereços da landing page que podem enviar cliques para a API.
# 5500 = extensão Live Server do VS Code. TROCAR/ACRESCENTAR o link do site publicado.
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://akmos-palmas.netlify.app}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ===================== DOCUMENTAÇÃO DA API =====================
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info-title=API AKMOS - Site, Painel do Revendedor e Cliques

# ===================== TESTES (banco H2 em memória) =====================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:akmos;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.security.users.embedded.users.admin=senha-teste
%test.akmos.dados-iniciais=false
